<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121216">
  <title>hitcloude</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="barra">
    <div class="marcador marcador--record">
      <span class="etiqueta">Record</span>
      <span class="valor">0</span>
    </div>
    <div class="marcador marcador--nombre">
      <span class="etiqueta barra-nombre" id="barraNombre"></span>
    </div>
    <div class="marcador marcador--actual">
      <span class="etiqueta">Actual</span>
      <span class="valor">0</span>
    </div>
    <button class="boton-pausa" aria-label="Pausa">
      <svg width="14" height="16" viewBox="0 0 14 16" fill="currentColor" aria-hidden="true">
        <rect x="0" y="0" width="5" height="16" rx="1.5"/>
        <rect x="9" y="0" width="5" height="16" rx="1.5"/>
      </svg>
    </button>
  </header>

  <canvas id="juego"></canvas>

  <div class="hitmaker" aria-hidden="true"></div>

  <div id="nombre" class="oculto" role="dialog" aria-modal="true">
    <div class="go-panel">
      <p class="ini-titulo">Tu nombre</p>
      <input id="nombreInput" class="nombre-input" type="text" maxlength="8"
             autocomplete="off" autocapitalize="characters" spellcheck="false"
             inputmode="text" placeholder="hasta 8" aria-label="Tu nombre">
      <button id="nombreOk" class="go-reiniciar">Confirmar</button>
      <button id="nombreOmitir" class="go-reiniciar go-modo-libre">Omitir</button>
    </div>
  </div>

  <div id="inicio" class="oculto" role="dialog" aria-modal="true">
    <div class="go-panel">
      <p class="ini-titulo">HitClaud</p>
      <div class="marcador marcador--record ini-record">
        <span class="etiqueta">Record</span>
        <span class="valor" id="iniRecord">0</span>
      </div>
      <div class="ini-modos" role="group" aria-label="Duración">
        <button id="sel15" class="go-reiniciar ini-sel">15 seg</button>
        <button id="sel30" class="go-reiniciar ini-sel">30 seg</button>
        <button id="sel60" class="go-reiniciar ini-sel sel-activo">60 seg</button>
      </div>
      <button id="jugar" class="go-reiniciar ini-jugar">JUGAR</button>
      <button id="verRanking" class="ini-actu">Ranking</button>
      <button id="verActualizaciones" class="ini-actu">Actualizaciones</button>
    </div>
  </div>

  <!-- PANTALLA DE ACTUALIZACIONES (FASE 26): bitácora completa (reemplaza al aviso
       emergente de novedades, retirado). Las entradas se generan desde js/bitacora.js
       (NO se escriben a mano aquí). El panel scrollea internamente y el botón Cerrar
       queda SIEMPRE visible (ley: toda pantalla tiene salida). -->
  <div id="actualizaciones" class="oculto" role="dialog" aria-modal="true">
    <div class="actu-panel">
      <p class="actu-titulo">Actualizaciones</p>
      <div class="actu-lista" id="actuLista"></div>
      <button id="actuCerrar" class="go-reiniciar">Cerrar</button>
    </div>
  </div>

  <!-- PANTALLA DE RANKING (FASE 30): tabla de posiciones del servidor (js/ranking.js).
       Selector de modo, tabla scrolleable con Cerrar SIEMPRE visible (ley: toda pantalla
       tiene salida). Los tres estados (cargando / con datos / error) se pintan desde JS;
       los nombres se insertan como TEXTO, nunca como HTML. -->
  <div id="ranking" class="oculto" role="dialog" aria-modal="true">
    <div class="actu-panel">
      <p class="actu-titulo">Ranking</p>
      <div class="rank-modos" role="group" aria-label="Duración">
        <button class="go-reiniciar ini-sel rank-sel" data-modo="15">15 seg</button>
        <button class="go-reiniciar ini-sel rank-sel" data-modo="30">30 seg</button>
        <button class="go-reiniciar ini-sel rank-sel" data-modo="60">60 seg</button>
      </div>
      <div class="rank-cuerpo" id="rankCuerpo"></div>
      <button id="rankCerrar" class="go-reiniciar">Cerrar</button>
    </div>
  </div>

  <div id="gameover" class="oculto" role="dialog" aria-modal="true">
    <div class="go-panel">
      <p class="go-titulo">hitcloude</p>
      <p class="go-score oculto"><span class="etiqueta">Score</span><span class="valor">0</span></p>
      <p class="go-record oculto">¡Nuevo récord!</p>
      <p class="go-rank oculto"></p>
      <button id="jugar15" class="go-reiniciar">15 seg</button>
      <button id="jugar30" class="go-reiniciar">30 seg</button>
      <button id="jugar60" class="go-reiniciar">60 seg</button>
    </div>
  </div>

  <div id="pausa" class="oculto" role="dialog" aria-modal="true">
    <div class="go-panel">
      <p class="go-titulo">Pausa</p>
      <button id="continuar" class="go-reiniciar">Continuar</button>
      <button id="reiniciar" class="go-reiniciar go-modo-libre">Reiniciar</button>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/fisica.js"></script>
  <script src="js/puntuacion.js"></script>
  <script src="js/render.js"></script>
  <script src="js/bitacora.js"></script>
  <script src="js/ranking.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
