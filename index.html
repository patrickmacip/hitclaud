<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121216">
  <title>hitcloude</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- SPRITE de iconos monocromos (corona, casa, lápiz). Trazo simple, heredan el color
       del texto (currentColor). Definidos UNA vez y referenciados con <use> — sin archivos
       ni red. El podio (assets/podio-1.svg) ya existe y se reutiliza como <img>. -->
  <svg class="icono-sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <symbol id="ic-corona" viewBox="0 0 24 24"><path d="M2.5 8l4.2 3.2L12 4.5l5.3 6.7L21.5 8l-1.7 10.5H4.2L2.5 8z"/></symbol>
    <symbol id="ic-casa" viewBox="0 0 24 24"><path d="M12 3.2 21.5 11h-2.9v9.8h-4.7v-5.7h-2.8v5.7H5.4V11H2.5z"/></symbol>
    <symbol id="ic-lapiz" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.84 1.83 3.75 3.75 1.84-1.83z"/></symbol>
    <symbol id="ic-compartir" viewBox="0 0 24 24"><path d="M12 2.6l4 4-1.4 1.4L13 6.4V15h-2V6.4L9.4 8l-1.4-1.4 4-4z"/><path d="M5 10h3v2H6v8h12v-8h-2v-2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1z"/></symbol>
    <symbol id="ic-atras" viewBox="0 0 24 24"><path d="M14.6 4.6 7.2 12l7.4 7.4 1.6-1.6L10.4 12l5.8-5.8z"/></symbol>
    <symbol id="ic-cerrar" viewBox="0 0 24 24"><path d="M6.4 4.8 12 10.4l5.6-5.6 1.6 1.6L13.6 12l5.6 5.6-1.6 1.6L12 13.6l-5.6 5.6-1.6-1.6L10.4 12 4.8 6.4z"/></symbol>
  </svg>

  <!-- BARRA de juego: tres zonas SIN etiquetas de texto (P1). Izquierda = récord (corona +
       número, pequeño y tenue). Centro = puntaje grande (blanco) + tiempo debajo, apilados.
       Derecha = salir (casa, mismo peso que el récord; área táctil 44×44). -->
  <header class="barra">
    <div class="barra-record" aria-label="Récord">
      <svg class="icono icono-mini" aria-hidden="true"><use href="#ic-corona"></use></svg>
      <span class="valor" id="barraRecord">0</span>
    </div>
    <div class="barra-centro">
      <span class="valor" id="barraActual">0</span>
      <span class="barra-tiempo" id="barraTiempo"></span>
    </div>
    <button class="barra-salir" id="botonSalir" type="button" aria-label="Abandonar y volver al inicio">
      <svg class="icono" aria-hidden="true"><use href="#ic-casa"></use></svg>
    </button>
  </header>

  <canvas id="juego"></canvas>

  <div class="hitmaker" aria-hidden="true"></div>

  <!-- EDITAR NOMBRE (reusa este overlay tanto en la primera carga como al tocar el saludo).
       Guardar persiste; Cancelar vuelve al inicio sin cambiar nada (siempre hay salida). -->
  <div id="nombre" class="oculto" role="dialog" aria-modal="true">
    <div class="go-panel">
      <p class="ini-titulo">Tu nombre</p>
      <input id="nombreInput" class="nombre-input" type="text" maxlength="8"
             autocomplete="off" autocapitalize="characters" spellcheck="false"
             inputmode="text" placeholder="hasta 8" aria-label="Tu nombre">
      <button id="nombreOk" class="go-reiniciar">Guardar</button>
      <button id="nombreOmitir" class="go-reiniciar go-modo-libre">Cancelar</button>
    </div>
  </div>

  <!-- PANTALLA 1 — ELEGIR JUEGO (arranque). Título del proyecto, saludo editable, y una
       tarjeta por juego (se generan desde la estructura JUEGOS de main.js, fuente única).
       El ranking pertenece a CADA juego, así que NO vive aquí (se abre desde la pantalla 2
       o desde el fin). Abajo sólo queda Actualizaciones. -->
  <div id="inicio" class="oculto" role="dialog" aria-modal="true">
    <div class="go-panel">
      <p class="ini-titulo">HitClaud</p>
      <!-- Saludo pulsable (saludo + lápiz): abre editar-nombre. Área táctil ≥44px. -->
      <button class="ini-saludo" id="iniSaludo" type="button">
        <span id="iniSaludoTexto">Ponte un nombre</span>
        <svg class="icono icono-mini" aria-hidden="true"><use href="#ic-lapiz"></use></svg>
      </button>
      <!-- Tarjetas de juego (una por entrada de JUEGOS). Se llenan desde main.js. -->
      <div class="juego-lista" id="juegoLista"></div>
      <button id="verActualizaciones" class="ini-actu" type="button">Actualizaciones</button>
    </div>
  </div>

  <!-- PANTALLA 2 — ELEGIR DURACIÓN. Orden: flecha de atrás + nombre del juego · nombre del
       jugador (sólo lectura, discreto — se edita en la pantalla 1) · récord del jugador en
       ese juego y duración (con corona, cambia con la duración) · selector de duraciones
       (oculto si sólo hay una; la más corta viene marcada al entrar) · Ranking (del juego,
       en la duración seleccionada) · JUGAR. -->
  <div id="duracion" class="oculto" role="dialog" aria-modal="true">
    <div class="go-panel">
      <div class="nivel-cabecera">
        <button id="durAtras" class="btn-atras" type="button" aria-label="Atrás">
          <svg class="icono" aria-hidden="true"><use href="#ic-atras"></use></svg>
        </button>
        <span class="nivel-titulo" id="durJuego">HitClaud</span>
      </div>
      <p class="nivel-nombre" id="durNombre"></p>
      <div class="ini-record" aria-label="Récord del juego">
        <svg class="icono icono-mini" aria-hidden="true"><use href="#ic-corona"></use></svg>
        <span class="valor" id="durRecord">0</span>
      </div>
      <div class="ini-modos" id="durModos" role="group" aria-label="Duración"></div>
      <button id="durRanking" class="ini-ranking" type="button">
        <img src="assets/podio-1.svg" alt="" aria-hidden="true">
        <span>Ranking</span>
      </button>
      <button id="durJugar" class="go-reiniciar ini-jugar">JUGAR</button>
    </div>
  </div>

  <!-- PANTALLA DE ACTUALIZACIONES (FASE 26): bitácora completa (reemplaza al aviso
       emergente de novedades, retirado). Las entradas se generan desde js/bitacora.js
       (NO se escriben a mano aquí). El panel scrollea internamente y el botón Cerrar
       queda SIEMPRE visible (ley: toda pantalla tiene salida). -->
  <div id="actualizaciones" class="oculto" role="dialog" aria-modal="true">
    <div class="actu-panel">
      <p class="actu-titulo">Actualizaciones</p>
      <div class="actu-lista" id="actuLista"></div>
      <button id="actuCerrar" class="go-reiniciar">Cerrar</button>
    </div>
  </div>

  <!-- PANTALLA DE RANKING: SIEMPRE en el contexto de UN juego (el que traías de la pantalla 2
       o del fin). NO hay selector de juego (los juegos no se mezclan). Arriba, el nombre del
       juego. Se conserva el selector de DURACIÓN de ese juego. Al pie: JUGAR (arranca esa
       duración), Compartir y Cerrar (vuelve al origen). Los nombres del servidor van como TEXTO. -->
  <div id="ranking" class="oculto" role="dialog" aria-modal="true">
    <div class="actu-panel rank-panel">
      <!-- CABECERA fija: Compartir (icono, izq) · "Ranking" + juego (centro) · Cerrar (icono X, der).
           Los iconos son sólo icono, con área táctil 44×44. -->
      <div class="rank-cabecera">
        <button id="compartirRank" class="rank-icono" type="button" aria-label="Compartir">
          <svg class="icono" aria-hidden="true"><use href="#ic-compartir"></use></svg>
        </button>
        <div class="rank-titulo">
          <p class="actu-titulo">Ranking</p>
          <p class="rank-juego-nombre" id="rankJuegoNombre">HitClaud</p>
        </div>
        <button id="rankCerrar" class="rank-icono" type="button" aria-label="Cerrar">
          <svg class="icono" aria-hidden="true"><use href="#ic-cerrar"></use></svg>
        </button>
      </div>
      <div class="rank-modos" id="rankModos" role="group" aria-label="Duración"></div>
      <!-- ÚNICA zona desplazable: ocupa el espacio restante; las filas se alinean arriba. -->
      <div class="rank-cuerpo" id="rankCuerpo"></div>
      <!-- JUGAR fijo al pie, ancho completo. -->
      <button id="rankJugar" class="go-reiniciar ini-jugar rank-jugar">JUGAR</button>
    </div>
  </div>

  <!-- FIN DE PARTIDA (orden importa): puntaje, récord (corona), puesto de ranking, y luego:
       "Jugar de nuevo" (principal, mismo juego y duración), "Cambiar duración" (oculto si el
       juego tiene una sola), Ranking y Compartir, y "Menú de juegos" discreto abajo. -->
  <div id="gameover" class="oculto" role="dialog" aria-modal="true">
    <div class="go-panel">
      <p class="go-score oculto"><span class="valor">0</span></p>
      <p class="go-record oculto"><svg class="icono icono-mini" aria-hidden="true"><use href="#ic-corona"></use></svg> ¡Nuevo récord!</p>
      <p class="go-rank oculto"></p>
      <button id="finJugarDeNuevo" class="go-reiniciar ini-jugar">Jugar de nuevo</button>
      <button id="finCambiarDuracion" class="ini-ranking" type="button"><span>Cambiar duración</span></button>
      <button id="verRankingFin" class="ini-ranking" type="button">
        <img src="assets/podio-1.svg" alt="" aria-hidden="true">
        <span>Ranking</span>
      </button>
      <button id="compartirFin" class="ini-ranking" type="button">
        <svg class="icono icono-mini" aria-hidden="true"><use href="#ic-compartir"></use></svg>
        <span>Compartir</span>
      </button>
      <button id="finMenu" class="ini-actu" type="button">Menú de juegos</button>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/fisica.js"></script>
  <script src="js/puntuacion.js"></script>
  <script src="js/render.js"></script>
  <script src="js/bitacora.js"></script>
  <script src="js/ranking.js"></script>
  <script src="js/compartir.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
